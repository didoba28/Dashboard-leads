project_id = "dashboard-leads"

[auth]
site_url = "https://dashboard-leads-vert.vercel.app"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Active le fournisseur e-mail pour les comptes créés par un administrateur.
# L'interdiction des inscriptions publiques reste définie par [auth].enable_signup.
enable_signup = true
secure_password_change = true

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.rate_limit]
sign_in_sign_ups = 10
